services:
  - type: web
    name: contract-ai-backend
    env: python
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.8
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_STORAGE_BUCKET
        value: contracts
